<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Pop - 甜美社交App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons (纯代码矢量图标，100%稳定) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FFF8F6',
                            100: '#FFF0EC',
                            200: '#FFE4DB',
                        },
                        peach: {
                            300: '#FFC4D1',
                            400: '#FF9EB5',
                            500: '#FF6B8B',
                            600: '#E64A6B',
                        },
                        mocha: {
                            400: '#A68A8A',
                            500: '#8A6D6D',
                            700: '#6B4D4D',
                            800: '#4A3535',
                        }
                    },
                    fontFamily: {
                        sans: ['"Nunito"', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', 'sans-serif'],
                    },
                    boxShadow: {
                        'kawaii': '0 12px 28px rgba(255, 107, 139, 0.12)',
                        'kawaii-sm': '0 6px 16px rgba(255, 107, 139, 0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 软萌气泡点赞动画 */
        .like-anim {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 页面切换淡入淡出 */
        .fade-transition {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .view-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            z-index: 0;
            display: none; /* 彻底隐藏防止滚动穿透 */
        }
        .view-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
            z-index: 10;
            display: block;
        }

        /* 玻璃质感导航栏 */
        .glass-nav {
            background: rgba(255, 248, 246, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>

                <div class="relative w-16 flex justify-center">
                     <button class="absolute bottom-1 w-[60px] h-[60px] bg-peach-500 rounded-full flex justify-center items-center text-white shadow-kawaii transform transition hover:scale-105 active:scale-95 border-[4px] border-white">
                        <i class="fa-solid fa-plus text-[28px]"></i>
                    </button>
                </div>

                <!-- 4. 收藏 (Favorite) 代替原消息模块 -->
                <button class="nav-btn flex flex-col items-center gap-1 w-12 transition-colors duration-300" onclick="switchView('favorite', this)">
                    <i class="fa-solid fa-star text-[24px]"></i>
                    <span class="text-[11px] font-bold">收藏</span>
                </button>
                
                <!-- 5. 我 (Profile) -->
                <button class="nav-btn flex flex-col items-center gap-1 w-12 transition-colors duration-300" onclick="switchView('profile', this)">
                    <i class="fa-solid fa-user text-[24px]"></i>
                    <span class="text-[11px] font-bold">我</span>
                </button>
            </div>
            
            <!-- iOS 底部Home Indicator -->
            <div class="w-[140px] h-[5px] bg-mocha-800 rounded-full absolute bottom-2 left-1/2 -translate-x-1/2 opacity-80"></div>
        </div>
        
    </div>

    <!-- 交互脚本 -->
    <script>
        // 初始化设置"发现"按钮为高亮状态
        document.addEventListener("DOMContentLoaded", () => {
            const firstNavBtn = document.querySelectorAll('.nav-btn')[0];
            firstNavBtn.classList.remove('text-mocha-400');
            firstNavBtn.classList.add('text-peach-500');
        });

        // 视图切换逻辑
        function switchView(viewId, clickedBtn) {
            const allBtns = document.querySelectorAll('.nav-btn');
            allBtns.forEach(btn => {
                btn.classList.remove('text-peach-500');
                btn.classList.add('text-mocha-400');
            });
            clickedBtn.classList.remove('text-mocha-400');
            clickedBtn.classList.add('text-peach-500');

            const views = ['view-discover', 'view-feed', 'view-favorite', 'view-profile'];
            views.forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('view-visible');
                el.classList.add('view-hidden');
            });

            const targetView = document.getElementById('view-' + viewId);
            setTimeout(() => {
                targetView.classList.remove('view-hidden');
                targetView.classList.add('view-visible', 'fade-transition');
            }, 30); 

            const topTitle = document.getElementById('top-title');
            if(viewId === 'discover') topTitle.innerText = 'Bubble Pop';
            if(viewId === 'feed') topTitle.innerText = 'Moments';
            if(viewId === 'favorite') topTitle.innerText = 'My Favorites';
            if(viewId === 'profile') topTitle.innerText = 'My Diary';
        }

        // 点赞动效逻辑
        function toggleLike(btn, count) {
            const icon = btn.querySelector('.heart-icon');
            const countSpan = btn.querySelector('.like-count');
            
            icon.classList.remove('like-anim');
            void icon.offsetWidth; 
            
            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid', 'text-peach-500', 'like-anim');
                btn.classList.replace('text-mocha-500', 'text-peach-500');
                countSpan.innerText = count + 1;
            } else {
                icon.classList.remove('fa-solid', 'text-peach-500', 'like-anim');
                icon.classList.add('fa-regular');
                btn.classList.replace('text-peach-500', 'text-mocha-500');
                countSpan.innerText = count;
            }
        }
    </script>
</body>
</html>
